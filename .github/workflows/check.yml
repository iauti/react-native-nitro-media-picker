name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: git diff --exit-code -- packages/react-native-nitro-media-picker/nitrogen
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bun run specs
      - run: bun run --cwd apps/example expo prebuild --platform android --no-install
      - run: ./gradlew :react-native-nitro-media-picker:assembleDebug :react-native-nitro-media-picker:testDebugUnitTest -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/example/android
  ios-helpers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-ios-helpers.sh
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/example expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: apps/example/ios
      - run: xcodebuild -workspace NitroMediaPicker.xcworkspace -scheme NitroMediaPicker -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/example/ios
